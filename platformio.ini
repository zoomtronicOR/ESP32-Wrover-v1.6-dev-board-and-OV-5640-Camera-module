; ESP32-WROVER-DEV v1.6 + OV5640 — ESP-IDF (via PlatformIO / pioarduino)
[platformio]
default_envs = wrover
src_dir = main

[env:wrover]
platform = espressif32
framework = espidf
board = esp32dev
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    main/web/index.html
upload_port = COM8
upload_speed = 921600
monitor_port = COM8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; AI-Thinker ESP32-CAM + OV2640 (4 MB flash, microSD slot). Flash with the ESP32-CAM-MB USB board.
[env:esp32cam]
platform = espressif32
framework = espidf
board = esp32dev
board_build.flash_mode = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 1966080
board_build.partitions = partitions_4mb.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.esp32cam.defaults
board_build.embed_txtfiles =
    main/web/index.html
upload_port = COM8
upload_speed = 460800
monitor_port = COM8
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
